# The gate CI can run. Everything except the Pleamar scene compile lives in tests/gate.sh, the
# same script `bin/mooi check` runs, so local and CI cannot drift (audit 2026-11-06, G6/G12).
#
# Pleamar and a compositor are not available on the runner: the scene compile is deliberately not
# faked. A green run says the launcher, logic, suites and generated scenes are sound, not that the
# scenes compile. Run `bin/mooi check` on a machine with Pleamar for that half.
name: check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # v4.2.2, pinned by commit rather than a moving tag (audit G6)
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: install what the gate needs and CI can have
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends lua5.4 shellcheck jq
      - name: the gate (the same script `bin/mooi check` runs)
        run: sh tests/gate.sh --no-pleamar
      - name: generated scenes match their generators
        run: |
          python3 tools/gen-settings.py
          python3 tools/gen-frame.py
          python3 tools/gen-opening.py
          python3 tools/gen-surface.py
          git diff --exit-code -- shell tools
