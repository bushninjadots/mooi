#!/usr/bin/env python3
# Now playing panel for kitty - shows current music track with album art
# Usage: include from kitty.conf with: include now-playing.conf
# Or run directly: kitty +kitten now-playing

import sys
import os
import subprocess
import time

def get_now_playing():
    """Get currently playing track using playerctl or mpc"""
    # Try playerctl first (works with most players via DBus)
    try:
        result = subprocess.run(
            ['playerctl', 'metadata', '--format={{{{artist}}}} - {{{{title}}}}}'],
            capture_output=True, text=True, timeout=2
        )
        if result.returncode == 0 and result.stdout.strip():
            return result.stdout.strip()
    except Exception:
        pass
    
    # Fall back to mpc
    try:
        result = subprocess.run(
            ['mpc', 'current', '--format={{artist}} - {{title}}'],
            capture_output=True, text=True, timeout=2
        )
        if result.returncode == 0 and result.stdout.strip():
            return result.stdout.strip()
    except Exception:
        pass
    
    return "No music playing"

def get_album_art():
    """Try to get album art using playerctl"""
    try:
        result = subprocess.run(
            ['playerctl', 'metadata', '--format={{{{mpris-artist}}}}}'],
            capture_output=True, text=True, timeout=2
        )
        # Try to get art URL
        result2 = subprocess.run(
            ['playerctl', 'metadata', '--format={{{{mpris-artUrl}}}}}'],
            capture_output=True, text=True, timeout=2
        )
        if result2.returncode == 0 and result2.stdout.strip() and result2.stdout.strip().startswith('http'):
            return result2.stdout.strip()
    except Exception:
        pass
    return None

def get_progress():
    """Get playback progress"""
    try:
        result = subprocess.run(
            ['playerctl', 'status', '--format={{status}}'],
            capture_output=True, text=True, timeout=2
        )
        if result.returncode == 0:
            status = result.stdout.strip()
            if status == 'Playing':
                return "▶"
            elif status == 'Paused':
                return "‖"
    except Exception:
        pass
    return ""

def main():
    # Get the current track info
    track = get_now_playing()
    progress = get_progress()
    
    # Format the output
    if track and track != "No music playing":
        # Truncate if too long (kitty has width limits)
        max_width = int(os.environ.get('KITTY_WINDOW_WIDTH', 80)) - 20
        if len(track) > max_width:
            track = track[:max_width-3] + "..."
        output = f"{progress} {track}"
    else:
        output = "No music playing"
    
    # Print with formatting for kitty
    # Use the active foreground color from the theme
    print(f"\033[38;2;223;228;220m{output}\033[0m", end='')

if __name__ == '__main__':
    main()