# github sidecar — user settings (plain KEY=VALUE, sourced by the scripts).
# No secrets belong in here; gh auth lives in the system keyring.

SIDECAR_PCT=32            # panel width as percentage of the kitty window (25-45)
SIDECAR_REFRESH=45        # seconds between auto refresh of the RUNS view (0 disables)
SIDECAR_LIMIT=30          # max rows fetched per gh list
SIDECAR_SCAN_DEPTH=5      # max directory depth when scanning for git repos
SIDECAR_SCAN_TTL=600      # seconds to cache the project scan
