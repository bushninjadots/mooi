# github sidecar keybindings — included from kitty.conf via
#   include sidecar/sidecar-keys.conf
# All shortcuts verified conflict-free against kitty 0.49.2 defaults and the
# user's Hyprland binds (Super+CTRL+*, ALT+F-keys).

# open / focus / close the github side panel (right split, ~SIDECAR_PCT wide)
map alt+g launch --type=window --keep-focus --allow-remote-control --cwd current /home/user/.config/kitty/sidecar/toggle.sh

# build monitor: workflow runs of the active project in a dedicated tab
map alt+t launch --type=tab --cwd current --tab-title build-watch /home/user/.config/kitty/sidecar/build-watch.sh

# resize the split (tall layout: narrower/wider adjusts the column split,
# shorter/taller adjusts rows in the right column when there are several)
map ctrl+alt+left  resize_window narrower
map ctrl+alt+right resize_window wider
map ctrl+alt+down  resize_window shorter
map ctrl+alt+up    resize_window taller
map ctrl+alt+0     resize_window reset

# pane navigation uses kitty defaults: ctrl+shift+] next window,
# ctrl+shift+[ previous window, ctrl+TAB next tab.
