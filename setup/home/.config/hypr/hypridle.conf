#  ◈ HYPRIDLE CONFIGURATION
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

general {
    lock_cmd = ~/.config/hypr/scripts/lock-session.sh   # whichever shell is up (audit 2026-10-21)
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl eval 'hl.dispatch(hl.dsp.dpms({ action = "on" }))'
}

listener {
    timeout = 1800                      # lock after 30 min idle (was 10, 2026-10-26)
    on-timeout = loginctl lock-session
}

listener {
    timeout = 3600                      # suspend after 60 min idle (was 20)
    on-timeout = systemctl suspend
}
