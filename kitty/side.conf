# mooi's terminal side panel (kitty/side.py): include from kitty.conf with
#   include /home/user/Projects/mooi/kitty/side.conf
# Alt+G shows the column (git on top; Claude, or a shell if Claude is in the main pane, below) or hides
# it — hidden, it keeps running; Alt+Shift+G closes it. Neither key is bound by kitty or Hyprland here.
map alt+g       kitten /home/user/Projects/mooi/kitty/side.py
map alt+shift+g kitten /home/user/Projects/mooi/kitty/side.py close
